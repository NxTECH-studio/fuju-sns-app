name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ktlint + detekt + spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: ktlint + detekt + spotless
        run: ./gradlew spotlessCheck ktlintCheck detekt --continue

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/spotless/

  android-build:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (commonTest)
        run: ./gradlew allTests

      - name: Assemble debug APK (dev flavor)
        run: ./gradlew :androidApp:assembleDevDebug

      # Screenshot 回帰検知。baseline PNG と 0px 差を要求する。
      # `verifyAndRecordRoborazziDebug` は:
      #   - baseline が既にあれば verify（diff があれば fail）
      #   - baseline が無ければ record（artifact としてアップロードされる）
      # 初回は開発者が手元で `./gradlew recordRoborazziDebug` を走らせて PNG を
      # commit するまで baseline は repo に入らない。その間も CI が真っ赤にならない
      # ように record モードを許可しておく（docs/testing.md 参照）。
      - name: Verify / record screenshots (roborazzi)
        run: >-
          ./gradlew
          :feature:auth:ui:verifyAndRecordRoborazziDebug
          :feature:timeline:ui:verifyAndRecordRoborazziDebug
          :feature:profile:ui:verifyAndRecordRoborazziDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

      # 成功 / 失敗にかかわらず roborazzi の出力（生成された baseline と diff）を
      # artifact として上げる。初回 CI では record モードで生成された PNG を
      # ダウンロードしてもらい、手元で `src/androidUnitTest/roborazzi/` に配置して
      # commit する運用（docs/testing.md 参照）。
      - name: Upload roborazzi outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-outputs
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
            **/src/androidUnitTest/roborazzi/

  ios-build:
    name: iOS framework + Xcode build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      # Xcode プロジェクトは KMP plugin で Generate される想定。
      # プロジェクト生成直後は以下の step を有効化して Xcode build まで回す。
      # - name: Xcode build
      #   working-directory: iosApp
      #   run: |
      #     xcodebuild \
      #       -scheme iosApp \
      #       -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
      #       CODE_SIGNING_ALLOWED=NO \
      #       build
